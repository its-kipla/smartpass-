<h1>Login to your account</h1>
<p>Enter your credentials to access your Smart Pass</p>
<form onsubmit="event.preventDefault()">
<div class="field">
    <span aria-hidden="true">👤</span>
    <input type="text" aria-label="Email or ID number" placeholder="email\ID number" required>
</div>
<div class="field">
    <span aria-hidden="true">🔒</span>
    <input id="pw" type="password" aria-label="Password" placeholder="password" required>
    <button type="button" aria-label="Show password" onclick="var p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'">👁</button>
</div>
<div class="lrow">
    <label>
        <input type="checkbox"> Remember me
    </label>
    <a href="#">Forgot password?</a>
</div>
<button class="go" type="submit">Log in</button>
<div class="or">OR</div>
<button class="goo" type="button">Continue with Google</button>
<p class="reg">Don't have an account? <a href="#">Register here</a>
</p>
</form>
</section>
<button class="homelink" href="index.html">Home</button>
</main>
</div>
</body>
