<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Log in | Smart Pass | Konza Technology City</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="green">
<div class="split">
    <div class="art" role="img" aria-label="Digital pathway through a data city"></div>

    <section class="pane">
        <form class="lcard" action="#" method="post">
            <a class="brand" href="index.html">
                <svg viewBox="0 0 160 138" fill="none" stroke="#0b5a2a" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M78 100L70 80L50 70L30 72M70 80L60 60L48 48M60 60L62 40M78 100L80 70L82 45L90 30M82 45L74 32M80 70L100 62L118 50M78 100L92 85L112 80L132 84M92 85L104 98L120 100M70 80L40 90L18 88M66 72L56 56M100 62L104 44M112 80L122 68"/><g stroke-width="2.2"><circle cx="26" cy="72" r="4"/><circle cx="46" cy="44" r="4"/><circle cx="62" cy="36" r="4"/><circle cx="92" cy="26" r="4"/><circle cx="72" cy="28" r="4"/><circle cx="122" cy="47" r="4"/><circle cx="136" cy="84" r="4"/><circle cx="124" cy="101" r="4"/><circle cx="14" cy="88" r="4"/><circle cx="54" cy="52" r="4"/><circle cx="104" cy="40" r="4"/><circle cx="125" cy="64" r="4"/></g><circle cx="86" cy="58" r="4.2" stroke="#e8101a" stroke-width="2.4"/><path d="M72 100h13v36H72z" fill="#0b5a2a" stroke="none"/></svg>
                <span><b>KONZA</b><small>TECHNOLOGY CITY</small></span>
            </a>

            <h1>login to your account</h1>
            <p>enter your credentials to access your smart pass</p>

            <div class="field">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/></svg>
                <input type="text" name="login" placeholder="email\ID number" aria-label="Email or ID number" autocomplete="username" required>
            </div>

            <div class="field">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
                <input type="password" id="pw" name="password" placeholder="password" aria-label="Password" autocomplete="current-password" required>
                <button type="button" id="toggle" aria-label="Show password">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16" id="slash"/></svg>
                </button>
            </div>

            <div class="lrow">
                <label><input type="checkbox" name="remember"> remember me</label>
                <a href="#">forgot password?</a>
            </div>

            <button class="go" type="submit">log in</button>

            <div class="or">OR</div>

            <button class="goo" type="button">continue with google</button>

            <p class="reg">Dont have an account? <a href="register.html">Register here</a></p>
        </form>

        <a class="homelink" href="index.html">Home</a>
    </section>
</div>

<script>
    var pw=document.getElementById('pw'),t=document.getElementById('toggle'),s=document.getElementById('slash');
    t.addEventListener('click',function(){
        var show=pw.type==='password';
        pw.type=show?'text':'password';
        s.style.display=show?'none':'';
        t.setAttribute('aria-label',show?'Hide password':'Show password');
    });
</script>
</body>
</html>
